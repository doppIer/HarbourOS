name: harboros

services:
  # Only this container can talk to dockerd, and only with the verbs enabled below.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1      # list / inspect / logs / stats
      POST: 1            # needed for start/stop/restart
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      EVENTS: 1
      INFO: 1
      # everything else (EXEC, IMAGES, VOLUMES, NETWORKS, BUILD, ...) stays 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]
    mem_limit: 32m

  harbor:
    build: .
    image: harboros:latest
    restart: unless-stopped
    depends_on: [docker-proxy]
    env_file: .env
    environment:
      DOCKER_HOST: http://docker-proxy:2375
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      DATA_DIR: /data
      DISK_PATHS: /host/root=/   # e.g. "/host/root=/,/host/data=/mnt/data"
      HOST_ROOT: /host/root      # store: checks which devices and folders the host has
      TERMINAL_MODE: ssh
      TERMINAL_SSH_TARGET: ${TERMINAL_SSH_USER:-harbor}@host.docker.internal
      PIPER_URL: http://piper:5000
      KOKORO_URL: http://kokoro:8880
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./data:/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # read-only, only used for disk usage (statfs); add more mounts as needed
      - /:/host/root:ro
      # - /mnt/data:/host/data:ro
    # Bind to the Tailscale IP only (set TAILSCALE_IP in .env) — never 0.0.0.0.
    ports:
      - ${TAILSCALE_IP:-127.0.0.1}:7080:7080
      # frame proxy for apps that refuse iframes (Nextcloud, …), one port per app
      - ${TAILSCALE_IP:-127.0.0.1}:7081-7090:7081-7090
    networks: [internal, default]
    mem_limit: 160m
    cpus: 0.5
    # Optional: let Sablier/Traefik discover it
    labels:
      - traefik.enable=false

  # Voices for the assistant (Settings → Assistant → Voice). Only HarborOS talks to them.
  # Piper: fast, has a Turkish voice. Built here with its voices baked in.
  piper:
    build: ./voice/piper
    image: harboros-piper:latest
    restart: unless-stopped
    networks: [internal]
    mem_limit: 400m
    cpus: 1
  # Kokoro: very natural English (no Turkish). The image is large (~2 GB).
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.9.2
    restart: unless-stopped
    networks: [internal, default]
    mem_limit: 2g
    cpus: 2

networks:
  internal:
    internal: true
